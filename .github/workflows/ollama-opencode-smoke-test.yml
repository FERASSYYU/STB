name: Local CPU coding agent (llama.cpp + OpenCode)
run-name: "Local agent test #${{ github.run_number }}"

# Manual trigger only, to avoid repeated expensive runs.
on:
  workflow_dispatch:

# Least privilege: the job needs no repository token and never pushes.
permissions: {}

concurrency:
  group: local-cpu-agent
  cancel-in-progress: false

env:
  # Pinned llama.cpp build tag (CPU-only build). Newest numbered tag checked: b12422.
  LLAMA_TAG: "b12422"
  # Official llama.cpp-org GGUF conversion of Gemma 4 E4B IT.
  MODEL_REPO: "ggml-org/gemma-4-e4b-it-GGUF"
  # Exact file, confirmed from the repository listing. The mtp-* files are
  # draft models for speculative decoding and are deliberately not used.
  MODEL_FILE_NAME: "gemma-4-E4B-it-Q4_0.gguf"
  MODEL_ALIAS: "gemma-4-e4b-it"
  # Conservative context for a 4-vCPU / 16 GB runner.
  CTX_SIZE: "8192"
  SERVER_PORT: "8080"
  OPENCODE_VERSION: "1.19.5"
  GODOT_VERSION: "4.6.3"

jobs:
  agent:
    name: Build llama.cpp, serve Gemma, run OpenCode, validate Godot
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions: {}

    steps:
      - name: Record runner resources
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          echo "CORES=$(nproc)" >> "$GITHUB_ENV"
          {
            echo "## Runner"
            echo '```text'
            echo "CPU model: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs || true)"
            echo "Cores: $(nproc)"
            free -h
            df -h "$RUNNER_TEMP"
            echo "GPU device nodes: $(ls /dev/nvidia* /dev/dri 2>/dev/null | wc -l) (expected 0)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Actions are pinned to full commit SHAs. actions/cache v5.1.0 runs on Node 24.
      - name: Restore llama.cpp build cache
        id: llama-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/llama-install
          key: llama-cpu-${{ env.LLAMA_TAG }}-ubuntu24-v2

      - name: Build llama.cpp (CPU-only)
        if: steps.llama-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q cmake build-essential
          git clone --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_VULKAN=OFF \
            -DGGML_METAL=OFF \
            -DLLAMA_CURL=OFF
          cmake --build "$RUNNER_TEMP/llama.cpp/build" --config Release -j "$CORES" --target llama-server
          mkdir -p "$RUNNER_TEMP/llama-install/bin"
          cp "$RUNNER_TEMP/llama.cpp/build/bin/llama-server" "$RUNNER_TEMP/llama-install/bin/"

      - name: Verify CPU-only llama.cpp binary (Test A, build level)
        shell: bash
        run: |
          set -Eeuo pipefail
          bin="$RUNNER_TEMP/llama-install/bin/llama-server"
          test -x "$bin"
          if ldd "$bin" | grep -Eiq 'cuda|vulkan|nvidia|metal|rocm|libhip'; then
            echo "GPU backend library linked into the CPU-only binary." >&2
            exit 1
          fi
          "$bin" --version 2>&1 | tail -n 3 || true
          echo "LLAMA_SERVER=$bin" >> "$GITHUB_ENV"

      # Resolve the exact file and its SHA-256 from the Hugging Face API.
      - name: Resolve model file and expected SHA-256
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.request
          repo = os.environ["MODEL_REPO"]
          name = os.environ["MODEL_FILE_NAME"]
          url = f"https://huggingface.co/api/models/{repo}/tree/main?recursive=true"
          with urllib.request.urlopen(url, timeout=60) as r:
              entries = json.load(r)
          matches = [e for e in entries if e.get("type") == "file" and e["path"] == name]
          if len(matches) != 1:
              print(f"{name} not found in {repo}. GGUF files present:", file=sys.stderr)
              for e in entries:
                  if e["path"].endswith(".gguf"):
                      print("  ", e["path"], file=sys.stderr)
              sys.exit(1)
          e = matches[0]
          lfs = e.get("lfs") or {}
          if not lfs.get("oid") or not lfs.get("size"):
              print("No LFS SHA-256/size metadata for", e["path"], file=sys.stderr)
              sys.exit(1)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"MODEL_FILE={e['path']}\n")
              env.write(f"MODEL_SHA256={lfs['oid']}\n")
              env.write(f"MODEL_SIZE_BYTES={lfs['size']}\n")
          # Values written to GITHUB_ENV are not visible in this step, so report from Python.
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write("## Model identity\n")
              s.write(f"- Repository: `{repo}`\n")
              s.write(f"- File: `{e['path']}`\n")
              s.write(f"- SHA-256: `{lfs['oid']}`\n")
              s.write(f"- Size: {lfs['size'] // 1024 // 1024} MiB\n")
          print("Resolved:", e["path"], "size:", lfs["size"], "sha256:", lfs["oid"])
          PY

      - name: Restore model cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/models
          key: gguf-${{ env.MODEL_REPO }}-${{ env.MODEL_FILE_NAME }}-v1

      - name: Download and verify model (Test B)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/models"
          model_path="$RUNNER_TEMP/models/$MODEL_FILE"
          if [[ -f "$model_path" ]] && echo "$MODEL_SHA256  $model_path" | sha256sum -c --status -; then
            echo "Cached model verified."
          else
            rm -f "$model_path"
            start=$(date +%s)
            curl --fail --location --retry 5 --retry-delay 5 \
              "https://huggingface.co/$MODEL_REPO/resolve/main/$MODEL_FILE" \
              --output "$model_path"
            echo "Download seconds: $(( $(date +%s) - start ))"
            echo "$MODEL_SHA256  $model_path" | sha256sum -c -
          fi
          echo "MODEL_PATH=$model_path" >> "$GITHUB_ENV"
          echo "- Test B (model integrity): PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Start llama.cpp server (CPU, one request at a time)
        shell: bash
        run: |
          set -Eeuo pipefail
          log="$RUNNER_TEMP/llama-server.log"
          load_start=$(date +%s)
          nohup "$LLAMA_SERVER" \
            -m "$MODEL_PATH" \
            --alias "$MODEL_ALIAS" \
            --host 127.0.0.1 --port "$SERVER_PORT" \
            -c "$CTX_SIZE" \
            -t "$CORES" -tb "$CORES" \
            -np 1 \
            -ngl 0 \
            --jinja \
            > "$log" 2>&1 &
          echo $! > "$RUNNER_TEMP/llama-server.pid"
          ready=0
          for _ in $(seq 1 300); do
            if curl --fail --silent "http://127.0.0.1:$SERVER_PORT/health" | grep -q '"ok"'; then
              ready=1; break
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/llama-server.pid")" 2>/dev/null; then break; fi
            sleep 2
          done
          if [[ "$ready" != "1" ]]; then
            echo "llama-server did not become healthy. Log tail:" >&2
            tail -n 100 "$log" >&2 || true
            exit 1
          fi
          echo "- Model load and health: $(( $(date +%s) - load_start ))s" >> "$GITHUB_STEP_SUMMARY"
          # Test A (runtime): the server must not report a GPU backend.
          if grep -Eiq 'CUDA|Vulkan|Metal|ROCm' "$log"; then
            echo "GPU backend mentioned in server log:" >&2
            grep -Ei 'CUDA|Vulkan|Metal|ROCm' "$log" >&2
            exit 1
          fi
          echo "- Test A (CPU-only, runtime): PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify text inference and tool calling (Tests C, D, E)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, sys, time, urllib.request
          base = f"http://127.0.0.1:{os.environ['SERVER_PORT']}/v1/chat/completions"
          alias = os.environ["MODEL_ALIAS"]
          summary = os.environ["GITHUB_STEP_SUMMARY"]

          def post(payload):
              req = urllib.request.Request(base, data=json.dumps(payload).encode(),
                                           headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=900) as r:
                  return json.load(r)

          # Test D: plain text.
          t0 = time.time()
          d = post({"model": alias, "max_tokens": 32, "temperature": 0,
                    "messages": [{"role": "user", "content": "Reply with the single word: pong"}]})
          text = d["choices"][0]["message"].get("content") or ""
          if "pong" not in text.lower():
              print("Test D failed, content:", text, file=sys.stderr); sys.exit(1)
          tps = d.get("timings", {}).get("predicted_per_second")
          with open(summary, "a") as s:
              s.write(f"- Test D (text inference): PASS in {time.time()-t0:.1f}s, generation {tps} tok/s\n")

          # Test E: a real tool call must come back as structured tool_calls.
          tool = {"type": "function", "function": {
              "name": "record_marker",
              "description": "Record a marker value.",
              "parameters": {"type": "object",
                             "properties": {"value": {"type": "string"}},
                             "required": ["value"]}}}
          d = post({"model": alias, "max_tokens": 128, "temperature": 0,
                    "tools": [tool], "tool_choice": "auto",
                    "messages": [{"role": "user", "content": "Call the record_marker tool with value ok."}]})
          calls = d["choices"][0]["message"].get("tool_calls") or []
          if not calls or calls[0]["function"]["name"] != "record_marker":
              print("Test E failed, response:", json.dumps(d)[:800], file=sys.stderr); sys.exit(1)
          with open(summary, "a") as s:
              s.write("- Test E (structured tool call): PASS\n")
          print("Test E passed:", calls[0]["function"]["arguments"])
          PY

      - name: Install OpenCode CLI (user-owned prefix)
        shell: bash
        run: |
          set -Eeuo pipefail
          NPM_PREFIX="$RUNNER_TEMP/npm-global"
          npm install --global --prefix "$NPM_PREFIX" "opencode-ai@${OPENCODE_VERSION}"
          echo "$NPM_PREFIX/bin" >> "$GITHUB_PATH"
          export PATH="$NPM_PREFIX/bin:$PATH"
          opencode --version

      - name: Create isolated GDScript test project
        shell: bash
        run: |
          set -Eeuo pipefail
          TEST_DIR="$RUNNER_TEMP/opencode-godot-smoke-test"
          echo "TEST_DIR=$TEST_DIR" >> "$GITHUB_ENV"
          mkdir -p "$TEST_DIR/scripts" "$TEST_DIR/tests"
          cd "$TEST_DIR"

          cat > project.godot <<'GODOT'
          ; Engine configuration file.
          ; This is a disposable test project created by GitHub Actions.

          config_version=5

          [application]
          config/name="OpenCode Agent Smoke Test"

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          GODOT

          cat > scripts/income_calculator.gd <<'GDSCRIPT'
          extends RefCounted

          # The agent must implement this function without changing its signature.
          static func calculate_income(base_income: int, multiplier: float) -> int:
              # TODO: Return the mathematical floor of base_income * multiplier.
              return 0
          GDSCRIPT

          cat > tests/smoke_test.gd <<'GDSCRIPT'
          extends SceneTree

          const IncomeCalculator = preload("res://scripts/income_calculator.gd")

          func _initialize() -> void:
              var cases: Array[Dictionary] = [
                  {"base": 100, "multiplier": 1.5, "expected": 150},
                  {"base": 99, "multiplier": 0.5, "expected": 49},
                  {"base": 0, "multiplier": 3.0, "expected": 0},
                  {"base": -3, "multiplier": 0.5, "expected": -2},
              ]

              for test_case: Dictionary in cases:
                  var actual: int = IncomeCalculator.calculate_income(
                      int(test_case["base"]),
                      float(test_case["multiplier"])
                  )
                  if actual != int(test_case["expected"]):
                      push_error(
                          "FAIL: base=%s multiplier=%s expected=%s got=%s" % [
                              test_case["base"],
                              test_case["multiplier"],
                              test_case["expected"],
                              actual
                          ]
                      )
                      quit(1)
                      return

              print("PASS: all income calculator cases")
              quit(0)
          GDSCRIPT

          cat > README.md <<'README'
          # Disposable smoke-test project

          Created by GitHub Actions. Nothing here is game code.
          README

          cat > AGENTS.md <<'AGENTS'
          # Smoke-test agent instructions

          You are testing whether the local model can make one small GDScript edit.
          - Read the existing script before editing it.
          - Edit ONLY `scripts/income_calculator.gd`.
          - Preserve the function name, parameters, and return type.
          - Implement mathematical floor of `base_income * multiplier`, returned as int.
          - Do not truncate toward zero: for example, floor(-1.5) must be -2.
          - Do not create, delete, or modify any other file.
          - Do not use shell commands, network access, web search, or subagents.
          - Do not change the test or project files.
          AGENTS

          git init --quiet
          git config user.name "GitHub Actions Smoke Test"
          git config user.email "actions-smoke-test@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Create baseline smoke test"
          echo "Disposable project created at: $TEST_DIR"

      # Permission sets are written per stage, so each agent call gets only the rights it needs.
      - name: Run OpenCode repository inspection (Test F)
        shell: bash
        working-directory: ${{ runner.temp }}/opencode-godot-smoke-test
        run: |
          set -Eeuo pipefail
          export PATH="$RUNNER_TEMP/npm-global/bin:$PATH"
          cat > opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "llamacpp/gemma-4-e4b-it",
            "provider": {
              "llamacpp": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "llama.cpp (local CPU)",
                "options": { "baseURL": "http://127.0.0.1:8080/v1" },
                "models": { "gemma-4-e4b-it": { "name": "Gemma 4 E4B (local)" } }
              }
            },
            "permission": {
              "*": "deny",
              "read": "allow",
              "glob": "allow",
              "grep": "allow",
              "bash": "deny",
              "webfetch": "deny",
              "websearch": "deny",
              "task": "deny",
              "skill": "deny",
              "question": "deny",
              "external_directory": "deny",
              "doom_loop": "allow"
            }
          }
          JSON
          set +e
          timeout --signal=TERM --kill-after=30s 10m opencode run --agent build \
            --print-logs --log-level DEBUG \
            --model "llamacpp/${MODEL_ALIAS}" \
            "Use the file tools only. List the main directories of this project and name the important GDScript files. Answer in plain text." \
            > "$RUNNER_TEMP/test-f-output.txt" 2>&1
          rc=$?
          set -e
          echo "--- OpenCode output (last 200 lines) ---"
          tail -n 200 "$RUNNER_TEMP/test-f-output.txt"
          echo "--- llama-server log (last 60 lines) ---"
          tail -n 60 "$RUNNER_TEMP/llama-server.log" || true
          if [[ "$rc" != "0" ]]; then echo "Test F: OpenCode exit $rc" >&2; exit 1; fi
          if [[ ! -s "$RUNNER_TEMP/test-f-output.txt" ]]; then echo "Test F: OpenCode printed nothing." >&2; exit 1; fi
          for needle in scripts tests income_calculator; do
            if ! grep -qi "$needle" "$RUNNER_TEMP/test-f-output.txt"; then
              echo "Test F: answer does not mention '$needle'." >&2; exit 1
            fi
          done
          echo "- Test F (repository inspection): PASS (answer names scripts/, tests/, income_calculator.gd; tool use not independently logged)" >> "$GITHUB_STEP_SUMMARY"

      - name: Run OpenCode GDScript edit (Test G)
        shell: bash
        working-directory: ${{ runner.temp }}/opencode-godot-smoke-test
        run: |
          set -Eeuo pipefail
          export PATH="$RUNNER_TEMP/npm-global/bin:$PATH"
          cat > opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "llamacpp/gemma-4-e4b-it",
            "provider": {
              "llamacpp": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "llama.cpp (local CPU)",
                "options": { "baseURL": "http://127.0.0.1:8080/v1" },
                "models": { "gemma-4-e4b-it": { "name": "Gemma 4 E4B (local)" } }
              }
            },
            "permission": {
              "*": "deny",
              "read": "allow",
              "glob": "allow",
              "grep": "allow",
              "edit": { "*": "deny", "scripts/income_calculator.gd": "allow" },
              "bash": "deny",
              "webfetch": "deny",
              "websearch": "deny",
              "task": "deny",
              "skill": "deny",
              "question": "deny",
              "external_directory": "deny",
              "doom_loop": "allow"
            }
          }
          JSON
          start=$(date +%s)
          set +e
          timeout --signal=TERM --kill-after=30s 20m opencode run --agent build \
            --model "llamacpp/${MODEL_ALIAS}" \
            "Read AGENTS.md. Implement the requested function in scripts/income_calculator.gd. Use only the allowed file tools. Do not run commands and do not touch any other file. Then briefly state what you changed." \
            > "$RUNNER_TEMP/test-g-output.txt" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/test-g-output.txt"
          echo "OpenCode exit $rc after $(( $(date +%s) - start ))s"
          if [[ "$rc" != "0" ]]; then echo "Test G: OpenCode failed or timed out (exit $rc)." >&2; exit 1; fi
          if git diff --quiet -- scripts/income_calculator.gd; then
            echo "Test G: OpenCode did not modify the target file." >&2; exit 1
          fi
          unexpected="$(git status --porcelain --untracked-files=all | awk '{print $2}' | grep -v '^scripts/income_calculator\.gd$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Test G: unexpected files changed:" >&2; printf '%s\n' "$unexpected" >&2; exit 1
          fi
          {
            echo "## Agent edit (Test G)"
            echo '```diff'
            git diff -- scripts/income_calculator.gd
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "- Test G (GDScript edit, one file only): PASS" >> "$GITHUB_STEP_SUMMARY"
          git add -A && git commit --quiet -m "Agent implementation (Test G)"

      - name: Install the pinned Godot editor
        shell: bash
        run: |
          set -Eeuo pipefail
          GODOT_ARCHIVE="$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          GODOT_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output "$GODOT_ARCHIVE"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$GODOT_ARCHIVE" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          test -x "$GODOT_BIN" || chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Validate the GDScript edit with Godot (Test I)
        shell: bash
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --headless --path "$TEST_DIR" --editor --quit
          "$GODOT_BIN" --headless --path "$TEST_DIR" --script res://tests/smoke_test.gd
          echo "- Test I (Godot headless, after Test G): PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Error correction (Test H)
        shell: bash
        working-directory: ${{ runner.temp }}/opencode-godot-smoke-test
        run: |
          set -Eeuo pipefail
          export PATH="$RUNNER_TEMP/npm-global/bin:$PATH"
          # 1. Inject a controlled, reversible failure into the TEST file only.
          sed -i 's/{"base": 0, "multiplier": 3.0, "expected": 0}/{"base": 0, "multiplier": 3.0, "expected": 1}/' tests/smoke_test.gd
          git diff --quiet -- tests/smoke_test.gd && { echo "Fault injection did not apply." >&2; exit 1; }
          git add -A && git commit --quiet -m "Inject controlled test fault"
          set +e
          "$GODOT_BIN" --headless --path "$TEST_DIR" --script res://tests/smoke_test.gd > "$RUNNER_TEMP/test-h-before.txt" 2>&1
          before_rc=$?
          set -e
          if [[ "$before_rc" == "0" ]]; then echo "Test H: injected fault did not make the test fail." >&2; exit 1; fi
          # 2. Allow the agent to edit only the test file, and give it the Godot error.
          cat > opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "llamacpp/gemma-4-e4b-it",
            "provider": {
              "llamacpp": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "llama.cpp (local CPU)",
                "options": { "baseURL": "http://127.0.0.1:8080/v1" },
                "models": { "gemma-4-e4b-it": { "name": "Gemma 4 E4B (local)" } }
              }
            },
            "permission": {
              "*": "deny",
              "read": "allow",
              "glob": "allow",
              "grep": "allow",
              "edit": { "*": "deny", "tests/smoke_test.gd": "allow" },
              "bash": "deny",
              "webfetch": "deny",
              "websearch": "deny",
              "task": "deny",
              "skill": "deny",
              "question": "deny",
              "external_directory": "deny",
              "doom_loop": "allow"
            }
          }
          JSON
          prompt="The Godot test failed with this output: $(cat "$RUNNER_TEMP/test-h-before.txt" | tail -n 15). Read tests/smoke_test.gd and fix the wrong expected value in the test so it matches the correct floor result. Edit ONLY tests/smoke_test.gd. Do not change the implementation. Do not run commands. Then briefly state what you changed."
          set +e
          timeout --signal=TERM --kill-after=30s 15m opencode run --agent build \
            --model "llamacpp/${MODEL_ALIAS}" "$prompt" > "$RUNNER_TEMP/test-h-output.txt" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/test-h-output.txt"
          if [[ "$rc" != "0" ]]; then echo "Test H: OpenCode failed or timed out (exit $rc)." >&2; exit 1; fi
          # 3. Only the test file may change, and the rerun must pass.
          unexpected="$(git status --porcelain --untracked-files=all | awk '{print $2}' | grep -v '^tests/smoke_test\.gd$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Test H: unexpected files changed:" >&2; printf '%s\n' "$unexpected" >&2; exit 1
          fi
          if git diff --quiet -- tests/smoke_test.gd; then
            echo "Test H: agent did not change the test file." >&2; exit 1
          fi
          "$GODOT_BIN" --headless --path "$TEST_DIR" --script res://tests/smoke_test.gd
          echo "- Test H (error correction, test file only, Godot rerun): PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Stop server and record final resources (Test J)
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          pid_file="$RUNNER_TEMP/llama-server.pid"
          {
            echo "## Final resources (Test J)"
            echo '```text'
            if [[ -f "$pid_file" ]] && kill -0 "$(cat "$pid_file")" 2>/dev/null; then
              pid="$(cat "$pid_file")"
              grep -E 'VmHWM|VmRSS' "/proc/$pid/status" || true
              kill "$pid" || true
            fi
            echo "Load average: $(cut -d' ' -f1-3 /proc/loadavg)"
            free -h
            df -h "$RUNNER_TEMP"
            echo "Elapsed: $(( $(date +%s) - ${START_EPOCH:-$(date +%s)} ))s"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
